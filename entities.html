Finanças, de 2014/01/20, foi declarada a caducidade da autorização
concedida pelo então Vice-Presidente do Governo Regional em
1992/01/08, à sociedade, CARFAX INVESTIMENTOS E PARTICIPAÇÕES, S.A., por falta de pagamento das taxas anuais de funcionamento
desde o período que teve início em 2012/02/20 e seguintes, com efeitos a
partir da data do incumprimento, nos termos da alínea c) do n.º 1 do artigo
10.° do Regulamento das Atividades Industriais, Comerciais e de Serviços,
aprovado pelo Decreto Regulamentar Regional n.º 21/87/M, de 5 de
setembro e alínea b) do n.º 1 do art.º 6.º da Portaria n.º 222/99, de 29 de
dezembro.
